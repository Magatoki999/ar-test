<!doctype html>
<html lang="ja">
  <head>
    <title>Simple VR Placer (Diagnostic Mode)</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <style>
      body { margin: 0; overflow: hidden; background-color: #222; }
      #info {
        position: absolute;
        top: 20px;
        width: 100%;
        text-align: center;
        color: white;
        font-family: sans-serif;
        pointer-events: none;
        z-index: 100;
        font-size: 1.2rem;
        text-shadow: 1px 1px 2px black;
        line-height: 1.5;
      }
      #error-log {
        color: #ff6666;
        font-size: 0.9rem;
        margin-top: 10px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="info">
      🍡 大福 VR (診断モード)<br/>
      <span id="status">起動中...</span>
      <div id="error-log"></div>
    </div>
    <script type="module">
      // 画面にエラーを直接出力する（Quest実機でのデバッグ用）
      window.addEventListener('error', function(event) {
        document.getElementById('error-log').innerHTML += `[Error] ${event.message}<br/>`;
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.getElementById('error-log').innerHTML += `[Async Error] ${event.reason}<br/>`;
      });

      import * as THREE from 'three';
      import { VRButton } from 'three/addons/webxr/VRButton.js';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

      let camera, scene, renderer;
      let controller1, controller2;
      let raycaster;
      
      let daifukuModel = null;
      let floorMesh = null;
      let statusText = document.getElementById('status');

      try {
        init();
        animate();
      } catch (e) {
        document.getElementById('error-log').innerHTML += `[Init Error] ${e.message}<br/>`;
      }

      function init() {
        statusText.innerHTML = "1. 3D空間を作成中...";

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x333333); 

        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.6, 3);

        const ambientLight = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.5);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(1, 3, 2);
        scene.add(dirLight);

        // 仮想の床
        const floorGeo = new THREE.PlaneGeometry(20, 20);
        floorGeo.rotateX(-Math.PI / 2);
        const floorMat = new THREE.MeshBasicMaterial({ color: 0x222222, visible: false }); 
        floorMesh = new THREE.Mesh(floorGeo, floorMat);
        scene.add(floorMesh);

        // 床の網目
        const grid = new THREE.GridHelper(20, 40, 0x888888, 0x444444);
        scene.add(grid);

        statusText.innerHTML = "2. 大福モデルを読み込み中...";

        // 大福モデルの読み込み
        const loader = new GLTFLoader();
        loader.load('daifuku2.glb', (gltf) => {
          daifukuModel = gltf.scene;
          const box = new THREE.Box3().setFromObject(daifukuModel);
          const size = box.getSize(new THREE.Vector3());
          const scale = 0.2 / Math.max(size.x, size.y, size.z);
          daifukuModel.scale.setScalar(scale);
          
          const boxScaled = new THREE.Box3().setFromObject(daifukuModel);
          daifukuModel.position.y = -boxScaled.min.y;
          
          statusText.innerHTML = "🍡 準備完了！画面下の「ENTER VR」を押してください";
          statusText.style.color = "#00ff00";
        }, undefined, (error) => {
          throw new Error("モデルの読み込みに失敗 (" + error.message + ")");
        });

        statusText.innerHTML = "3. VRシステムを準備中...";

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        document.body.appendChild(VRButton.createButton(renderer));

        // コントローラーの設定（重いモデル読込をやめ、軽い四角形にしました）
        controller1 = renderer.xr.getController(0);
        controller1.addEventListener('select', onSelect);
        scene.add(controller1);

        controller2 = renderer.xr.getController(1);
        controller2.addEventListener('select', onSelect);
        scene.add(controller2);

        // 手の代わりの白いキューブ
        const boxGeo = new THREE.BoxGeometry(0.05, 0.05, 0.05);
        const boxMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const controllerMesh = new THREE.Mesh(boxGeo, boxMat);
        controller1.add(controllerMesh.clone());
        controller2.add(controllerMesh.clone());

        // レーザーの線
        const geometry = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(0, 0, -1)
        ]);
        const line = new THREE.Line(geometry);
        line.name = 'line';
        line.scale.z = 5; 

        controller1.add(line.clone());
        controller2.add(line.clone());

        raycaster = new THREE.Raycaster();
        window.addEventListener('resize', onWindowResize);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function onSelect(event) {
        if (!daifukuModel) return;

        const controller = event.target;
        const tempMatrix = new THREE.Matrix4();
        tempMatrix.identity().extractRotation(controller.matrixWorld);

        raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
        raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

        const intersects = raycaster.intersectObject(floorMesh);

        if (intersects.length > 0) {
          const hit = intersects[0];
          const clonedModel = SkeletonUtils.clone(daifukuModel);
          clonedModel.position.copy(hit.point);
          
          const cameraPos = new THREE.Vector3();
          camera.getWorldPosition(cameraPos);
          cameraPos.y = clonedModel.position.y;
          clonedModel.lookAt(cameraPos);
          
          scene.add(clonedModel);
        }
      }

      function animate() {
        renderer.setAnimationLoop(render);
      }

      function render() {
        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
