<!doctype html>
<html lang="ja">
  <head>
    <title>A-Frame VR Placer</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <!-- 安定性の高い A-Frame 1.4.2 を読み込み -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script>
      // 1. モデルのサイズを約20cmに自動調整し、底面を床に合わせるプログラム
      AFRAME.registerComponent('auto-scale-position', {
        init: function () {
          this.el.addEventListener('model-loaded', () => {
            const object3D = this.el.getObject3D('mesh');
            if (object3D) {
              const box = new THREE.Box3().setFromObject(object3D);
              const size = box.getSize(new THREE.Vector3());
              const maxDim = Math.max(size.x, size.y, size.z);
              
              // 最大寸法が約0.2(20cm)になるようにスケールを計算
              const scale = 0.2 / maxDim;
              this.el.setAttribute('scale', `${scale} ${scale} ${scale}`);
              
              // スケール適用後に高さを計算してY位置（上下）を補正
              object3D.scale.set(scale, scale, scale);
              object3D.updateMatrixWorld(true);
              
              const scaledBox = new THREE.Box3().setFromObject(object3D);
              const currentPos = this.el.getAttribute('position');
              this.el.setAttribute('position', {
                x: currentPos.x,
                y: currentPos.y - scaledBox.min.y,
                z: currentPos.z
              });
            }
          });
        }
      });

      // 2. コントローラーのトリガーを引いた時に大福を配置するプログラム
      AFRAME.registerComponent('daifuku-spawner', {
        init: function () {
          this.el.addEventListener('triggerdown', (evt) => {
            const raycaster = this.el.components.raycaster;
            if (!raycaster) return;
            
            // レーザーが見えない床(#floor)に当たっているか確認
            const intersection = raycaster.getIntersection(document.querySelector('#floor'));
            if (intersection) {
              // 大福のクローンを作成して配置
              const daifuku = document.createElement('a-entity');
              daifuku.setAttribute('gltf-model', '#daifuku-model');
              daifuku.setAttribute('position', intersection.point);
              daifuku.setAttribute('auto-scale-position', ''); // サイズ自動調整を発動
              
              // カメラ（自分）の方を向かせる
              const camera = document.querySelector('[camera]');
              if (camera) {
                const cameraPos = camera.object3D.position;
                const angle = Math.atan2(cameraPos.x - intersection.point.x, cameraPos.z - intersection.point.z);
                daifuku.setAttribute('rotation', `0 ${angle * 180 / Math.PI} 0`);
              }
              
              document.querySelector('a-scene').appendChild(daifuku);
            }
          });
        }
      });
    </script>
    <style>
      #ui-overlay {
        position: absolute;
        top: 20px;
        width: 100%;
        text-align: center;
        color: white;
        font-family: sans-serif;
        font-size: 1.5rem;
        z-index: 100;
        pointer-events: none;
        text-shadow: 2px 2px 4px black;
      }
    </style>
  </head>
  <body>
    <!-- 画面上部のメッセージ -->
    <div id="ui-overlay">
      🍡 大福 VR (A-Frame 安定版)<br/>
      <span style="font-size: 1rem; color: #00ff00;">右下の「VR」アイコンを押してください</span>
    </div>

    <!-- VR空間の定義 -->
    <a-scene background="color: #333333" webxr="referenceSpaceType: local-floor">
      
      <!-- 3Dモデルの事前読み込み -->
      <a-assets>
        <a-asset-item id="daifuku-model" src="daifuku2.glb"></a-asset-item>
      </a-assets>

      <!-- プレイヤー（カメラと両手のコントローラー） -->
      <a-entity id="rig">
        <a-camera position="0 1.6 0"></a-camera>
        <!-- 両手にレーザーポインターと配置機能を付与 -->
        <a-entity laser-controls="hand: left" raycaster="objects: #floor" daifuku-spawner></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: #floor" daifuku-spawner></a-entity>
      </a-entity>

      <!-- レーザーの当たり判定用の見えない床 -->
      <a-plane id="floor" rotation="-90 0 0" width="20" height="20" visible="false"></a-plane>
      
      <!-- 視覚的な目印となる網目模様の床 -->
      <a-entity geometry="primitive: plane; width: 20; height: 20" rotation="-90 0 0" material="color: #888888; wireframe: true"></a-entity>

      <!-- 照明 -->
      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
      <a-light type="directional" color="#ffffff" intensity="1.0" position="-1 2 1"></a-light>

    </a-scene>
  </body>
</html>
