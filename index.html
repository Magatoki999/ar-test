<!doctype html>
<html lang="ja">
  <head>
    <title>Legacy VR Placer</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <style>
      body { margin: 0; overflow: hidden; background-color: #222; }
      #info {
        position: absolute;
        top: 10%;
        width: 100%;
        text-align: center;
        color: white;
        font-family: sans-serif;
        z-index: 100;
        font-size: 1.5rem;
        line-height: 1.5;
        text-shadow: 1px 1px 2px black;
      }
      #error-log { color: #ff6666; font-size: 1rem; margin-top: 20px; word-break: break-all; padding: 0 10%; }
      #status { font-weight: bold; color: #ffff00; }
    </style>
    <script>
      // プログラムが動く前に、どんなエラーでも最優先で画面に表示するおまじない
      window.addEventListener('error', function(event) {
        var log = document.getElementById('error-log');
        if(log) log.innerHTML += `[致命的エラー] ${event.message}<br/>`;
      });
      window.addEventListener('unhandledrejection', function(event) {
        var log = document.getElementById('error-log');
        if(log) log.innerHTML += `[非同期エラー] ${event.reason}<br/>`;
      });
    </script>
  </head>
  <body>
    <div id="info">
      🍡 大福 VR (Quest 1 互換モード)<br/>
      <span id="status">システム起動前...</span>
      <div id="error-log"></div>
    </div>
    <script type="module">
      // 現代の機能(importmap)を廃止し、直接古い安定版(v0.150.0)を読み込む
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js';
      import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/webxr/VRButton.js';
      import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/loaders/GLTFLoader.js';
      import * as SkeletonUtils from 'https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/utils/SkeletonUtils.js';

      let camera, scene, renderer;
      let controller1, controller2;
      let raycaster;
      let daifukuModel = null;
      let floorMesh = null;
      let statusText = document.getElementById('status');

      try {
        statusText.innerHTML = "モジュール読込成功。初期化中...";
        init();
        animate();
      } catch (e) {
        document.getElementById('error-log').innerHTML += `[Init Error] ${e.message}<br/>`;
      }

      function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x333333); 

        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.6, 3);

        const ambientLight = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(1, 3, 2);
        scene.add(dirLight);

        const floorGeo = new THREE.PlaneGeometry(20, 20);
        floorGeo.rotateX(-Math.PI / 2);
        const floorMat = new THREE.MeshBasicMaterial({ color: 0x222222, visible: false }); 
        floorMesh = new THREE.Mesh(floorGeo, floorMat);
        scene.add(floorMesh);

        const grid = new THREE.GridHelper(20, 40, 0x888888, 0x444444);
        scene.add(grid);

        statusText.innerHTML = "大福モデル読込中...";

        const loader = new GLTFLoader();
        loader.load('daifuku2.glb', (gltf) => {
          daifukuModel = gltf.scene;
          const box = new THREE.Box3().setFromObject(daifukuModel);
          const size = box.getSize(new THREE.Vector3());
          const scale = 0.2 / Math.max(size.x, size.y, size.z);
          daifukuModel.scale.setScalar(scale);
          
          const boxScaled = new THREE.Box3().setFromObject(daifukuModel);
          daifukuModel.position.y = -boxScaled.min.y;
          
          statusText.innerHTML = "✅ 準備完了！画面下の「ENTER VR」を押してください";
          statusText.style.color = "#00ff00";
        }, undefined, (error) => {
          throw new Error("モデル読込失敗 (" + error.message + ")");
        });

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        document.body.appendChild(VRButton.createButton(renderer));

        controller1 = renderer.xr.getController(0);
        controller1.addEventListener('select', onSelect);
        scene.add(controller1);

        controller2 = renderer.xr.getController(1);
        controller2.addEventListener('select', onSelect);
        scene.add(controller2);

        const boxGeo = new THREE.BoxGeometry(0.05, 0.05, 0.05);
        const boxMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const controllerMesh = new THREE.Mesh(boxGeo, boxMat);
        controller1.add(controllerMesh.clone());
        controller2.add(controllerMesh.clone());

        const geometry = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(0, 0, -1)
        ]);
        const line = new THREE.Line(geometry);
        line.scale.z = 5; 
        controller1.add(line.clone());
        controller2.add(line.clone());

        raycaster = new THREE.Raycaster();
        window.addEventListener('resize', onWindowResize);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function onSelect(event) {
        if (!daifukuModel) return;
        const controller = event.target;
        const tempMatrix = new THREE.Matrix4();
        tempMatrix.identity().extractRotation(controller.matrixWorld);

        raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
        raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

        const intersects = raycaster.intersectObject(floorMesh);
        if (intersects.length > 0) {
          const clonedModel = SkeletonUtils.clone(daifukuModel);
          clonedModel.position.copy(intersects[0].point);
          
          const cameraPos = new THREE.Vector3();
          camera.getWorldPosition(cameraPos);
          cameraPos.y = clonedModel.position.y;
          clonedModel.lookAt(cameraPos);
          
          scene.add(clonedModel);
        }
      }

      function animate() {
        renderer.setAnimationLoop(render);
      }

      function render() {
        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
