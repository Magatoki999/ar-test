<!doctype html>
<html lang="ja">
  <head>
    <title>Simple VR Placer</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <style>
      body { margin: 0; overflow: hidden; background-color: #222; }
      #info {
        position: absolute;
        top: 20px;
        width: 100%;
        text-align: center;
        color: white;
        font-family: sans-serif;
        pointer-events: none;
        z-index: 100;
        font-size: 1.2rem;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="info">🍡 大福 VR プレイスメント<br/>モデル読込中...</div>
    <script type="module">
      import * as THREE from 'three';
      import { VRButton } from 'three/addons/webxr/VRButton.js';
      import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

      let camera, scene, renderer;
      let controller1, controller2;
      let controllerGrip1, controllerGrip2;
      let raycaster;
      
      let daifukuModel = null;
      let floorMesh = null;
      let infoText = document.getElementById('info');

      init();
      animate();

      function init() {
        // ==========================================
        // 1. 空間（シーン）の基本設定
        // ==========================================
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222); // 暗いグレーの背景

        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.6, 3);

        const ambientLight = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.5);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(1, 3, 2);
        scene.add(dirLight);

        // ==========================================
        // 2. 仮想の床とグリッド（目印）を作成
        // ==========================================
        const floorGeo = new THREE.PlaneGeometry(20, 20);
        floorGeo.rotateX(-Math.PI / 2);
        const floorMat = new THREE.MeshBasicMaterial({ color: 0x222222, visible: false }); // レーザー判定用（透明）
        floorMesh = new THREE.Mesh(floorGeo, floorMat);
        scene.add(floorMesh);

        // 床の網目模様
        const grid = new THREE.GridHelper(20, 40, 0x888888, 0x444444);
        scene.add(grid);

        // ==========================================
        // 3. 大福モデルの読み込み
        // ==========================================
        const loader = new GLTFLoader();
        loader.load('daifuku2.glb', (gltf) => {
          daifukuModel = gltf.scene;
          
          // サイズを約20cmに調整
          const box = new THREE.Box3().setFromObject(daifukuModel);
          const size = box.getSize(new THREE.Vector3());
          const scale = 0.2 / Math.max(size.x, size.y, size.z);
          daifukuModel.scale.setScalar(scale);
          
          // 底面をY=0に合わせる
          const boxScaled = new THREE.Box3().setFromObject(daifukuModel);
          daifukuModel.position.y = -boxScaled.min.y;
          
          infoText.innerHTML = "🍡 準備完了！<br/>「ENTER VR」を押して、トリガーで配置してください";
        }, undefined, (error) => {
          console.error(error);
          infoText.innerHTML = "⚠️ daifuku2.glb の読み込みに失敗しました";
          infoText.style.color = "#ff6666";
        });

        // ==========================================
        // 4. レンダラー（描画エンジン）とVRボタンの設定
        // ==========================================
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        // ★重要: VRモードを有効化★
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Three.js公式の確実なVR起動ボタンを追加
        document.body.appendChild(VRButton.createButton(renderer));

        // ==========================================
        // 5. VRコントローラーとレーザーポインターの設定
        // ==========================================
        controller1 = renderer.xr.getController(0);
        controller1.addEventListener('select', onSelect); // トリガーを引いた時のイベント
        scene.add(controller1);

        controller2 = renderer.xr.getController(1);
        controller2.addEventListener('select', onSelect);
        scene.add(controller2);

        // コントローラーの3Dモデル（Questのコントローラーの形）を表示
        const controllerModelFactory = new XRControllerModelFactory();
        controllerGrip1 = renderer.xr.getControllerGrip(0);
        controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
        scene.add(controllerGrip1);

        controllerGrip2 = renderer.xr.getControllerGrip(1);
        controllerGrip2.add(controllerModelFactory.createControllerModel(controllerGrip2));
        scene.add(controllerGrip2);

        // コントローラーの先から出るレーザーの線を描画
        const geometry = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(0, 0, -1)
        ]);
        const line = new THREE.Line(geometry);
        line.name = 'line';
        line.scale.z = 5; // レーザーの長さ

        controller1.add(line.clone());
        controller2.add(line.clone());

        raycaster = new THREE.Raycaster();
        window.addEventListener('resize', onWindowResize);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      // ==========================================
      // 6. トリガーを引いた時の配置処理
      // ==========================================
      function onSelect(event) {
        if (!daifukuModel) return;

        const controller = event.target;
        const tempMatrix = new THREE.Matrix4();
        tempMatrix.identity().extractRotation(controller.matrixWorld);

        // コントローラーの位置からレーザーを飛ばす
        raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
        raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

        // 見えない床(floorMesh)との交差判定
        const intersects = raycaster.intersectObject(floorMesh);

        if (intersects.length > 0) {
          const hit = intersects[0];
          
          // 大福を複製
          const clonedModel = SkeletonUtils.clone(daifukuModel);
          clonedModel.position.copy(hit.point);
          
          // 大福を自分（カメラ）の方へ向かせる
          const cameraPos = new THREE.Vector3();
          camera.getWorldPosition(cameraPos);
          cameraPos.y = clonedModel.position.y; // 上下には傾かないようにする
          clonedModel.lookAt(cameraPos);
          
          scene.add(clonedModel);
        }
      }

      function animate() {
        renderer.setAnimationLoop(render);
      }

      function render() {
        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
